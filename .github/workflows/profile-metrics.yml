name: Update profile cards
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-metrics.yml
permissions:
  contents: write
concurrency:
  group: profile-cards
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Generate the activity cards
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from html import escape
          from datetime import datetime, timezone
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          
          USERNAME = 'Lucas-Henriquee'
          YEAR = datetime.now(timezone.utc).year
          ASSETS = Path('assets')
          
          
          def fetch_svg(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'Lucas-Profile-Metrics/1.0'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return ET.fromstring(response.read())
          
          
          def read_stats(tree):
              description = ' '.join(''.join(n.itertext()) for n in tree.iter() if n.tag.rsplit('}', 1)[-1] == 'desc')
              stars = re.search(r'Total Stars Earned:\s*([\d,]+)', description)
              commits = re.search(r'Total Commits\s*\([^)]*\)\s*:\s*([\d,]+)', description)
              if not stars or not commits:
                  raise ValueError('Statistics unavailable; keeping the previously generated cards.')
              return int(stars[1].replace(',', '')), int(commits[1].replace(',', ''))
          
          
          def read_views(tree):
              values = [''.join(n.itertext()).strip() for n in tree.iter() if n.tag.rsplit('}', 1)[-1] == 'text']
              numbers = [v.replace(',', '') for v in values if re.fullmatch(r'[\d,]+', v)]
              if not numbers:
                  raise ValueError('View counter unavailable; keeping the previously generated cards.')
              return int(numbers[-1])
          
          
          def render(stars, commits, views, mobile=False):
              width, height = (320, 482) if mobile else (960, 166)
              labels = [('PROFILE VIEWS', views, 'Image requests'), ('STARS EARNED', stars, 'Public repositories'), ('COMMITS', commits, f'{YEAR} · Public activity')]
              description = f'{views} profile views, {stars} stars earned, {commits} commits in {YEAR}. Refreshed daily from public statistics; values may be cached.'
              parts = [f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}" role="img" aria-labelledby="title desc">', '<title id="title">GitHub activity</title>', f'<desc id="desc">{escape(description)}</desc>', '''<style>
                .surface{fill:#f5f9fa;stroke:#d7e0e6}.label,.note{fill:#526572}.value{fill:#202b36}.signal{fill:#167b78;animation:signal 4s ease-in-out infinite}
                @media(prefers-color-scheme:dark){.surface{fill:#101923;stroke:#293642}.label,.note{fill:#aab9c7}.value{fill:#e6edf3}.signal{fill:#8fddd6}}
                @keyframes signal{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}
                text{font-family:Arial,Helvetica,sans-serif}.label{font-size:18px;letter-spacing:1px}.value{font-size:48px;font-weight:500}.note{font-size:16px}
              </style>''']
              for index, (label, value, note) in enumerate(labels):
                  x, y = (1, index * 160 + 1) if mobile else (index * 324 + 1, 1)
                  w = 318 if mobile else 310
                  parts.extend([f'<g transform="translate({x} {y})">', f'<rect class="surface" x="0" y="0" width="{w}" height="156" rx="12"/>', f'<text class="label" x="20" y="35">{label}</text>', f'<circle class="signal" cx="{w - 22}" cy="30" r="3"/>', f'<text class="value" x="20" y="94">{value:,}</text>', f'<text class="note" x="20" y="134">{escape(note)}</text>', '</g>'])
              parts.append('</svg>\n')
              return '\n'.join(parts)
          
          
          def save(stars, commits, views, directory=ASSETS):
              directory.mkdir(parents=True, exist_ok=True)
              (directory / 'activity.svg').write_text(render(stars, commits, views), encoding='utf-8')
              (directory / 'activity-mobile.svg').write_text(render(stars, commits, views, mobile=True), encoding='utf-8')
          
          
          if __name__ == '__main__':
              stats_url = f'https://github-readme-stats.vercel.app/api?username={USERNAME}&hide_rank=true&hide=issues,contribs,prs&commits_year={YEAR}&number_format=long'
              stars, commits = read_stats(fetch_svg(stats_url))
              views = read_views(fetch_svg(f'https://komarev.com/ghpvc/?username={USERNAME}&label=PROFILE+VIEWS'))
              save(stars, commits, views)
              print(f'Updated public metrics: {stars} stars, {commits} commits in {YEAR}, {views} views.')
          PYTHON
      - name: Publish updated cards
        shell: bash
        run: |
          if git diff --quiet -- assets/activity.svg assets/activity-mobile.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/activity-mobile.svg
          git commit -m 'Update profile activity cards'
          git push
