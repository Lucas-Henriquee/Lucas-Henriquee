name: Update profile cards
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-metrics.yml
permissions:
  contents: write
concurrency:
  group: profile-cards
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Generate the activity cards
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from html import escape
          from datetime import datetime, timezone
          import re
          import json
          import os
          import socket
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          
          USERNAME = 'Lucas-Henriquee'
          YEAR = datetime.now(timezone.utc).year
          ASSETS = Path('assets')
          
          
          def fetch(request):
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.read()
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 2:
                          raise
                  except (urllib.error.URLError, TimeoutError, socket.timeout):
                      if attempt == 2:
                          raise
                  time.sleep(2 ** (attempt + 1))
          
          
          def fetch_svg(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'Lucas-Profile-Metrics/2.0'})
              return ET.fromstring(fetch(request))
          
          
          def github_stats():
              token = os.environ['GH_TOKEN']
              now = datetime.now(timezone.utc)
              query = '''query($login: String!, $from: DateTime!, $to: DateTime!, $after: String) {
                user(login: $login) {
                  contributionsCollection(from: $from, to: $to) { totalCommitContributions }
                  repositories(first: 100, after: $after, privacy: PUBLIC,
                    isFork: false, ownerAffiliations: [OWNER]) {
                    nodes { stargazerCount }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }'''
              variables = {'login': USERNAME, 'from': f'{YEAR}-01-01T00:00:00Z',
                           'to': now.isoformat(), 'after': None}
              stars = 0
              commits = None
              while True:
                  request = urllib.request.Request('https://api.github.com/graphql',
                      data=json.dumps({'query': query, 'variables': variables}).encode(),
                      headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json',
                               'User-Agent': 'Lucas-Profile-Metrics/2.0'})
                  result = json.loads(fetch(request))
                  if result.get('errors'):
                      raise ValueError('GitHub statistics query failed')
                  user = result['data']['user']
                  commits = user['contributionsCollection']['totalCommitContributions']
                  repos = user['repositories']
                  stars += sum(repo['stargazerCount'] for repo in repos['nodes'])
                  if not repos['pageInfo']['hasNextPage']:
                      return stars, commits
                  variables['after'] = repos['pageInfo']['endCursor']
          
          
          def previous_values(directory):
              path = directory / 'activity.svg'
              if not path.exists():
                  return None
              tree = ET.parse(path).getroot()
              description = ' '.join(''.join(n.itertext()) for n in tree.iter()
                                     if n.tag.rsplit('}', 1)[-1] == 'desc')
              match = re.search(r'([\d,]+) profile views, ([\d,]+) stars earned, ([\d,]+) commits in (\d{4})', description)
              if not match:
                  raise ValueError('Cannot read the previously generated metrics')
              views, stars, commits, year = (int(value.replace(',', '')) for value in match.groups())
              return {'views': views, 'stars': stars, 'commits': commits, 'year': year}
          
          
          def unavailable(source, error):
              detail = f'HTTP {error.code}' if isinstance(error, urllib.error.HTTPError) else type(error).__name__
              print(f'::warning title={source} temporarily unavailable::{detail}; retaining the last known values.')
          
          
          def read_views(tree):
              values = [''.join(n.itertext()).strip() for n in tree.iter() if n.tag.rsplit('}', 1)[-1] == 'text']
              numbers = [v.replace(',', '') for v in values if re.fullmatch(r'[\d,]+', v)]
              if not numbers:
                  raise ValueError('View counter unavailable; keeping the previously generated cards.')
              return int(numbers[-1])
          
          
          def render(stars, commits, views, mobile=False, year=YEAR, stale_stats=False, stale_views=False):
              width, height = (320, 482) if mobile else (960, 166)
              labels = [('PROFILE VIEWS', views, 'Last known count' if stale_views else 'Image requests'), ('STARS EARNED', stars, 'Last known count' if stale_stats else 'Public repositories'), ('COMMITS', commits, f'{year} · ' + ('Last known count' if stale_stats else 'Public activity'))]
              description = f'{views} profile views, {stars} stars earned, {commits} commits in {year}. GitHub API statistics; view counts may be cached.'
              parts = [f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}" viewBox="0 0 {width} {height}" role="img" aria-labelledby="title desc">', '<title id="title">GitHub activity</title>', f'<desc id="desc">{escape(description)}</desc>', '''<style>
                .surface{fill:#f5f9fa;stroke:#d7e0e6}.label,.note{fill:#526572}.value{fill:#202b36}.signal{fill:#167b78;animation:signal 4s ease-in-out infinite}
                @media(prefers-color-scheme:dark){.surface{fill:#101923;stroke:#293642}.label,.note{fill:#aab9c7}.value{fill:#e6edf3}.signal{fill:#8fddd6}}
                @keyframes signal{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}
                text{font-family:Arial,Helvetica,sans-serif}.label{font-size:18px;letter-spacing:1px}.value{font-size:48px;font-weight:500}.note{font-size:16px}
              </style>''']
              for index, (label, value, note) in enumerate(labels):
                  x, y = (1, index * 160 + 1) if mobile else (index * 324 + 1, 1)
                  w = 318 if mobile else 310
                  parts.extend([f'<g transform="translate({x} {y})">', f'<rect class="surface" x="0" y="0" width="{w}" height="156" rx="12"/>', f'<text class="label" x="20" y="35">{label}</text>', f'<circle class="signal" cx="{w - 22}" cy="30" r="3"/>', f'<text class="value" x="20" y="94">{value:,}</text>', f'<text class="note" x="20" y="134">{escape(note)}</text>', '</g>'])
              parts.append('</svg>\n')
              return '\n'.join(parts)
          
          
          def save(stars, commits, views, directory=ASSETS, **options):
              directory.mkdir(parents=True, exist_ok=True)
              (directory / 'activity.svg').write_text(render(stars, commits, views, **options), encoding='utf-8')
              (directory / 'activity-mobile.svg').write_text(render(stars, commits, views, mobile=True, **options), encoding='utf-8')
          
          
          def main(directory=ASSETS):
              previous = previous_values(directory)
              stale_stats = stale_views = False
              year = YEAR
              try:
                  stars, commits = github_stats()
              except (urllib.error.URLError, TimeoutError, OSError, ValueError, KeyError, TypeError) as error:
                  if previous is None:
                      raise RuntimeError('GitHub unavailable and no saved metrics exist') from error
                  unavailable('GitHub API', error)
                  stars, commits, year = previous['stars'], previous['commits'], previous['year']
                  stale_stats = True
              try:
                  views = read_views(fetch_svg(f'https://komarev.com/ghpvc/?username={USERNAME}&label=PROFILE+VIEWS'))
              except (urllib.error.URLError, TimeoutError, OSError, ValueError, ET.ParseError) as error:
                  if previous is None:
                      raise RuntimeError('View counter unavailable and no saved metrics exist') from error
                  unavailable('View counter', error)
                  views = previous['views']
                  stale_views = True
              if stale_stats and stale_views:
                  print('Both sources unavailable; leaving both published cards unchanged.')
                  return
              save(stars, commits, views, directory, year=year,
                   stale_stats=stale_stats, stale_views=stale_views)
              print(f'Updated metrics: {stars} stars, {commits} commits in {year}, {views} views.')
          
          
          if __name__ == '__main__':
              main()
          PYTHON
      - name: Publish updated cards
        shell: bash
        run: |
          if git diff --quiet -- assets/activity.svg assets/activity-mobile.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/activity-mobile.svg
          git commit -m 'Update profile activity cards'
          export CARDS_REF="$(git rev-parse HEAD)"
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          readme = Path('README.md')
          source = readme.read_text(encoding='utf-8')
          for name in ('activity.svg', 'activity-mobile.svg'):
              url = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['CARDS_REF']}/assets/{name}"
              pattern = r'(src(?:set)?=")[^"]*assets/' + re.escape(name) + r'(?:\?[^"]*)?(")'
              source = re.sub(pattern, lambda match: match[1] + url + match[2], source)
          readme.write_text(source, encoding='utf-8')
          PYTHON
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m 'Refresh activity image references'
          fi
          git push
