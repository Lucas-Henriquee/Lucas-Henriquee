<svg xmlns="http://www.w3.org/2000/svg" width="960" height="144" viewBox="0 0 960 144" role="img" aria-labelledby="title desc">
<title id="title">GitHub activity</title>
<desc id="desc">3 profile views, 2 stars earned, 58 commits in 2026. Refreshed daily from public statistics; values may be cached.</desc>
<style>
      .surface{fill:#f5f9fa;stroke:#d7e0e6}.label,.note{fill:#526572}.value{fill:#202b36}.signal{fill:#167b78;animation:signal 4s ease-in-out infinite}
      @media(prefers-color-scheme:dark){.surface{fill:#101923;stroke:#293642}.label,.note{fill:#aab9c7}.value{fill:#e6edf3}.signal{fill:#8fddd6}}
      @keyframes signal{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}
      text{font-family:Arial,Helvetica,sans-serif}.label{font-size:13px;letter-spacing:1px}.value{font-size:40px;font-weight:500}.note{font-size:12px}
    </style>
<g transform="translate(1 1)">
<rect class="surface" x="0" y="0" width="310" height="132" rx="12"/>
<text class="label" x="20" y="30">PROFILE VIEWS</text>
<circle class="signal" cx="288" cy="25" r="3"/>
<text class="value" x="20" y="79">3</text>
<text class="note" x="20" y="110">Image requests</text>
</g>
<g transform="translate(325 1)">
<rect class="surface" x="0" y="0" width="310" height="132" rx="12"/>
<text class="label" x="20" y="30">STARS EARNED</text>
<circle class="signal" cx="288" cy="25" r="3"/>
<text class="value" x="20" y="79">2</text>
<text class="note" x="20" y="110">Public repositories</text>
</g>
<g transform="translate(649 1)">
<rect class="surface" x="0" y="0" width="310" height="132" rx="12"/>
<text class="label" x="20" y="30">COMMITS</text>
<circle class="signal" cx="288" cy="25" r="3"/>
<text class="value" x="20" y="79">58</text>
<text class="note" x="20" y="110">2026 · Public activity</text>
</g>
</svg>
